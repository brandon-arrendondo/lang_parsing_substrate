name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    # Write access only so a tag can create its GitHub Release (below).
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Rust installation
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Security Audit
        run: |
          cargo install cargo-audit
          cargo audit
        continue-on-error: true

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Build (all features)
        run: cargo build --all-features

      - name: Build (subset — C/C++ only)
        run: cargo build --no-default-features --features lang-c,lang-cpp

      - name: Build (no features)
        run: cargo build --no-default-features

      - name: Test (all features)
        run: cargo test --all-features

      - name: Test (subset — C/C++ only)
        run: cargo test --no-default-features --features lang-c,lang-cpp

      - name: Install cargo-about
        run: cargo install cargo-about --features cli

      # The licence file and SBOM describe what the PyPI wheel ships: the
      # default language set plus the `pyo3` bindings (pyproject.toml's
      # [tool.maturin] features). The crates.io release is source only and
      # bundles no dependency.
      - name: Generate Third-Party Licenses
        run: cargo about generate --features pyo3 about.hbs -o THIRD_PARTY_LICENSES.txt

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --features pyo3 --format json --spec-version 1.5

      - name: Stage SBOM release assets
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release
          cp lang-parsing-substrate.cdx.json \
             "release/lang-parsing-substrate-${VERSION}.cdx.json"
          cp THIRD_PARTY_LICENSES.txt \
             "release/lang-parsing-substrate-${VERSION}-THIRD_PARTY_LICENSES.txt"
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lang-parsing-substrate-${{ steps.version.outputs.VERSION }}
          path: release/*
          retention-days: 30

      # A tagged release keeps the SBOM and licence file permanently, as
      # knots and aurora-lint do; the CI artifact above expires.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
