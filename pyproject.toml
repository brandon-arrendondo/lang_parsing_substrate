[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "lang-parsing-substrate"
# Version is read from Cargo.toml at build time (dynamic below); keep
# `invoke bump-version` as the single place that edits it.
dynamic = ["version"]
description = "Shared language-parsing substrate for static-analysis tools — tree-sitter dispatch and analysis primitives across 16 languages, from Rust."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Brandon Arrendondo" }]
keywords = ["tree-sitter", "parsing", "language-detection", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/brandon-arrendondo/lang_parsing_substrate"
Repository = "https://github.com/brandon-arrendondo/lang_parsing_substrate"

[tool.maturin]
# Explicit rather than left to maturin's auto-detection: this crate's
# default build (no `pyo3` feature) is a plain rlib with no Python bindings
# at all, so nothing about the crate on its own implies "pyo3" the way it
# would for a crate with no other purpose.
bindings = "pyo3"
# Only the `pyo3` feature-gated module is exposed to Python; other
# `lang-*` features stay enabled via `all-languages` (default) so every
# compiled-in language is reachable through language_for_key from Python too.
features = ["pyo3"]
module-name = "lang_parsing_substrate"
