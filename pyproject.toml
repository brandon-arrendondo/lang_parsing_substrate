[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "lang-parsing-substrate"
# Version is read from Cargo.toml at build time (dynamic below); keep
# `invoke bump-version` as the single place that edits it.
dynamic = ["version"]
description = "Shared language-parsing substrate for static-analysis tools — tree-sitter dispatch and analysis primitives across 16 languages, from Rust."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]

[tool.maturin]
# Only the `pyo3` feature-gated module is exposed to Python; other
# `lang-*` features stay enabled via `all-languages` (default) so every
# compiled-in language is reachable through language_for_key from Python too.
features = ["pyo3"]
module-name = "lang_parsing_substrate"
